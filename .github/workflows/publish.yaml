name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately NO `registry-url`: that input makes setup-node write an
      # .npmrc with a placeholder `_authToken`, which suppresses OIDC trusted
      # publishing. The publish registry comes from publishConfig.registry.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      # Build BEFORE test, deliberately. src/packaging.test.ts and
      # tests/treeshake/subpath.test.ts both assert against dist/ and skip
      # themselves when it is absent, so with `npm test` first the published-
      # surface checks and the DS-09 subpath tree-shaking gate silently skipped
      # here — green, and measuring nothing.
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential and attaches provenance automatically.
      # NOTE: the npmjs trusted-publisher config must reference THIS filename
      # (publish.yaml) exactly — a mismatch 404s as "package not found".
      # `npm publish` with no --tag applies `latest` ALWAYS -- it does not
      # detect a prerelease suffix. Publishing 2.0.0-beta.1 bare would make the
      # beta the default install for everyone doing a bare `npm i`. Derive the
      # dist-tag from the version instead: any version containing `-` is a
      # prerelease and goes to `next`.
      - name: Derive dist-tag, and assert the tag matches package.json
        id: dist
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAGGED="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAGGED" ]; then
              echo "::error::git tag is v$TAGGED but package.json is $VERSION"
              exit 1
            fi
          fi
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$TAG'"

      - name: Publish to npm
        run: npm publish --tag "${{ steps.dist.outputs.tag }}"
